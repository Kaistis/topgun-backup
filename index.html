<h1>topgun backup</h1>
<p>topgun backup is a private backup job for one household. Every night it encrypts the files of
the household's home server and stores them in the household's own Google Drive, using
<a href="https://restic.net">restic</a> and <a href="https://rclone.org">rclone</a>.</p>
<p>It is not a public service, and nobody else can sign in to it.</p>
<p><a href="privacy.html">Privacy policy</a></p>
